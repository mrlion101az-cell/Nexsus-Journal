# NexusJournal: your own changes to the codex. This file is never overwritten; run /journal reload after editing.
#
# Change a page field by field, add your own, or hide pages, without touching the built-in codex.yml (which is
# replaced when the plugin updates). Page ids are lower case letters, digits, - and _ (see /journal check).
#
# Fields of a page:
#   plugin     the Nexus plugin it is about (the page only opens while that plugin runs and the player did not
#              hide it with NexusPath). Leave out for a page that belongs to nobody.
#   title      shown on the tile (keep it short)
#   icon       an item name, e.g. IRON_PICKAXE
#   group      "Getting started", "Gather and make", ... any name; pages are grouped by it in the lore
#   tip        the short action-bar line when it opens (about 40 characters)
#   body       what the page says once found
#   hint       what the closed tile says before it is found
#   triggers   what opens it: a list of  kind  or  kind:what  with * as a wildcard and | for "either":
#                command            any command of that plugin        command:rime   one command
#                break / place      a block:        break:*_ORE|ANCIENT_DEBRIS
#                craft              a crafted item:  craft:*_PICKAXE
#                use / interact     an item right-clicked / a block right-clicked:   use:GOLDEN_HOE
#                consume            something eaten or drunk
#                open               a menu opened:   open:BREWING_STAND|FURNACE  (BREWING, ENCHANTING, ANVIL ...)
#                world              entering a world by name:  world:*nether*
#                breed, kill        an animal bred / a mob killed by the player:   kill:ZOMBIE|SKELETON
#                death              the player dies
#                enchant, fish, sleep, bucket, join
#                api                nothing a player does: another plugin or staff opens it with
#                                   /journal discover <player> <id>
#   add-triggers   adds to the existing triggers instead of replacing them
#
# Example: a page for a plugin of your own, opened when the player first mines diamond.
#
# entries:
#   my-diamonds:
#     plugin: MyPlugin
#     title: "Diamond Sense"
#     icon: DIAMOND
#     group: "Gather and make"
#     tip: "Diamonds hum when you are near"
#     body: "Our server has a plugin that makes diamonds hum when you walk past."
#     hint: "Mine a diamond."
#     triggers: ["break:DIAMOND_ORE|DEEPSLATE_DIAMOND_ORE"]
#
# Change one thing about a built-in page:
#
# entries:
#   lode:
#     add-triggers: ["break:STONE"]
#
# Hide pages altogether:
#
# hidden-entries: [bathroom, chaos]
