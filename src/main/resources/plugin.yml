name: NexusJournal
version: ${project.version}
main: com.nexuscraft.nexusjournal.JournalPlugin
api-version: '1.21'
author: Nexus Universe
description: A field journal that teaches by doing. Pages open the first time you meet a system, and only for systems in your game.
softdepend: [NexusPath]

commands:
  journal:
    description: Read your field journal, get a new copy of the book, or see how many pages you have found.
    aliases: [fieldjournal]
    permission: nexusjournal.use
    permission-message: You cannot use the journal here.
    usage: /journal [open|book|stats]

permissions:
  nexusjournal.use:
    description: Use the field journal.
    default: true
  nexusjournal.admin:
    description: Open, grant, take back and check journal pages; reload.
    default: op
