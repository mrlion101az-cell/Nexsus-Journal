# NexusJournal codex: every page of the field journal. Generated by tools/gen-codex.py from NexusPath's catalog.yml
# and the sibling plugins' plugin.yml files; replaced when the plugin updates. Make your own changes in
# custom-codex.yml (it explains itself) and run /journal reload.

entries:

