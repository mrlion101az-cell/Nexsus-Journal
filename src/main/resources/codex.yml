    hint: "Keep playing; a toast will appear."
    triggers: ["command"]

  seasons:
    plugin: NexusSeasons
    title: "Seasons & Weather"
    icon: SUNFLOWER
    group: "Server life"
    tip: "The seasons change plants and mobs"
    body: "Spring, summer, fall and winter change plants, mobs and the sky."
    hint: "Play through a change of season."
    triggers: ["api"]

  sentinel:
    plugin: NexusSentinel
    title: "Safety and Reporting"
    icon: BELL
    group: "Server life"
    tip: "Report a problem with /report"
