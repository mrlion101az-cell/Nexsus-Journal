    title: "Strange Visions"
    icon: ENDER_EYE
    group: "Strange and spooky"
    tip: "Spooky sights only you can see"
    body: "Spooky sights and sounds that only you can see. Totally harmless."
    hint: "Play a long session."
    triggers: ["command"]

  kairos:
    plugin: NexusKairos
    title: "Kairos"
    icon: ECHO_SHARD
    group: "Strange and spooky"
